name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - name: "Ubuntu GCC 14"
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cmake_flags: "-DBUILD_TESTING=ON -DJSON_LIB_DOWNLOAD_JSON_TEST_SUITE=ON"
          - name: "Ubuntu GCC 13"
            os: ubuntu-22.04
            cc: gcc-13
            cxx: g++-13
            cmake_flags: "-DBUILD_TESTING=ON -DJSON_LIB_DOWNLOAD_JSON_TEST_SUITE=ON"

          # Linux Clang
          - name: "Ubuntu Clang 18"
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            cmake_flags: "-DBUILD_TESTING=ON -DJSON_LIB_DOWNLOAD_JSON_TEST_SUITE=ON"

          # Linux Sanitizers (ASan + UBSan)
          - name: "Ubuntu ASan/UBSan"
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            cmake_flags: "-DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DJSON_LIB_ENABLE_ASAN=ON -DJSON_LIB_ENABLE_UBSAN=ON"

          # Windows MSVC
          - name: "Windows MSVC 2022"
            os: windows-latest
            cmake_flags: "-DBUILD_TESTING=ON"

          # macOS Apple Clang
          - name: "macOS Apple Clang"
            os: macos-latest
            cmake_flags: "-DBUILD_TESTING=ON"

          # Embedded & Constrained Profiles
          - name: "Profile - Embedded"
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cmake_flags: "-DJSON_LIB_EMBEDDED=ON"
          - name: "Profile - No Exceptions"
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cmake_flags: "-DJSON_LIB_NO_EXCEPTIONS=ON"
          - name: "Profile - No Stdio"
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cmake_flags: "-DJSON_LIB_NO_STDIO=ON"
          - name: "Profile - No Dynamic Memory"
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cmake_flags: "-DJSON_LIB_NO_DYNAMIC_MEMORY=ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ -n "${{ matrix.cc }}" ]; then
            sudo apt-get install -y ${{ matrix.cc }} ${{ matrix.cxx }}
            echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
            echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          fi

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        if: contains(matrix.cmake_flags, 'BUILD_TESTING=ON')
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify Packaging & Consumer find_package
        if: runner.os == 'Linux' && contains(matrix.cmake_flags, 'BUILD_TESTING=ON') && !contains(matrix.cmake_flags, 'ASAN')
        run: |
          # Test installation
          cmake --install build --prefix /tmp/json_lib_install
          # Create and build minimal consumer project
          mkdir -p /tmp/consumer_test
          cat << 'EOF' > /tmp/consumer_test/CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(ConsumerTest CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(JSON_Lib CONFIG REQUIRED PATHS /tmp/json_lib_install)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE JSON_Lib::JSON_Lib)
          EOF
          cat << 'EOF' > /tmp/consumer_test/main.cpp
          #include <JSON_Lib.hpp>
          #include <iostream>
          int main() {
            JSON_Lib::JSON json;
            json.parse(JSON_Lib::BufferSource{ R"({"status":"ok"})" });
            JSON_Lib::BufferDestination dest;
            json.stringify(dest);
            return (dest.toString() == R"({"status":"ok"})") ? 0 : 1;
          }
          EOF
          cmake -B /tmp/consumer_test/build -S /tmp/consumer_test -DCMAKE_PREFIX_PATH=/tmp/json_lib_install
          cmake --build /tmp/consumer_test/build
          /tmp/consumer_test/build/consumer
          # Test CPack packaging
          cd build && cpack
